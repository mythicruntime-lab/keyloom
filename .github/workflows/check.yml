name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      # The release protocol feature embeds dist/, so build the frontend before Cargo.
      - run: npm run build

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features custom-protocol -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol

      # The installer section of inventory.json is only filled in after a local
      # package build, so it is excluded from the drift check.
      - name: License audit
        # bash stops on the first failing command; pwsh only checks the last one.
        shell: bash
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          node scripts/audit-licenses.mjs
          git diff --exit-code -- licenses ':!licenses/inventory.json'
