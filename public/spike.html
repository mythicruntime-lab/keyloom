<!doctype html><html lang="en"><meta charset="utf-8"><title>Keyloom • Native spike</title><style>body{margin:40px;background:#101c25;color:#e7eee9;font:18px 'Segoe UI',sans-serif}h1{font-weight:400}button,select{font:inherit;margin:8px;padding:12px;background:#233a43;color:#e7eee9;border:1px solid #518f87;border-radius:8px}canvas{width:100%;height:250px;background:#142832;border-radius:12px}pre{font-size:14px;max-height:230px;overflow:auto}.accent{color:#72d7b1}</style><h1>Keyloom <small class="accent">M0 native MIDI / audio / display spike</small></h1><p>Basic synthetic practice tone • native Windows MIDI input • no MIDI output</p><select id="devices"><option>Loading inputs…</option></select><button id="connect">Connect selected input</button><button id="refresh">Refresh Devices</button><p id="audio">Checking WASAPI audio…</p><canvas id="roll"></canvas><p>Explicit simulated input — press and release to test the PC tone:</p><div id="keys"></div><pre id="events"></pre><script type="module">
const invoke=window.__TAURI_INTERNALS__.invoke;
async function refresh(){const devices=await invoke('devices');document.querySelector('#devices').innerHTML='';for(const d of devices){const o=document.createElement('option');o.value=d.id;o.textContent=d.name;document.querySelector('#devices').append(o)}if(!devices.length)document.querySelector('#devices').innerHTML='<option value="">No MIDI input detected</option>';}refresh();
document.querySelector('#refresh').onclick=refresh;document.querySelector('#connect').onclick=()=>invoke('connect_device',{id:document.querySelector('#devices').value||null}).catch(alert);
for(const pitch of [60,62,64,65,67,69,71,72]){const b=document.createElement('button');b.textContent=`${pitch} ${['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'][pitch%12]}`;b.onpointerdown=()=>invoke('input_note',{pitch,on:true,velocity:85});b.onpointerup=b.onpointerleave=()=>invoke('input_note',{pitch,on:false,velocity:0});document.querySelector('#keys').append(b)}
setInterval(async()=>{const s=await invoke('status');document.querySelector('#audio').textContent=s.audio_error||'WASAPI stream opened. Audible output still requires a listening check.';document.querySelector('#events').textContent=s.events.join('\n');},100);
const c=document.querySelector('canvas'),ctx=c.getContext('2d');function draw(t){c.width=c.clientWidth*devicePixelRatio;c.height=250*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.fillStyle='#142832';ctx.fillRect(0,0,c.clientWidth,250);ctx.fillStyle='#72d7b1';for(let i=0;i<8;i++)ctx.fillRect(40+i*95,(t/5+i*34)%270-50,45,55);ctx.fillStyle='#f5db9a';ctx.fillRect(0,220,c.clientWidth,2);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
